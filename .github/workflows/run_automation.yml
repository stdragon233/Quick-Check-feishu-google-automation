name: XPENG Store Check Data Automation Line

# ⏰ 配置触发器
on:
  schedule:
    # 💡 关键：GitHub 使用的是 UTC 时间（世界协调时）。
    # 北京时间 每天 早上 5点运行
    - cron: '0 21 * * *'
  
  # 💡 额外赠送功能：允许你在 GitHub 网页上点击按钮“手动立刻触发跑一次”，方便随时测试！
  workflow_dispatch:

jobs:
  execute-automation:
    runs-on: ubuntu-latest  # 使用最新的 Linux 虚拟电脑

    steps:
    # 1. 把你的 GitHub 仓库代码下载到这台虚拟电脑上
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. 帮你在虚拟电脑上配置并启动 Python 环境
    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # 保持和你本地一致的 Python 版本

    # 3. 自动根据 requirements.txt 安装所有需要的第三方依赖库
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

   # 4. 【动作一】执行正向清洗：从飞书抓取最新数据，洗入 Google Sheets
    - name: Run Script 1 (Feishu to Google Sheets)
      env:
        FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        python main.py

    # ⏳ 5. 【新增智能缓冲】让云端电脑原地休眠 2 分钟，静静等待 Google Sheets 自动翻译和公式计算完成
    - name: Wait for Google Sheets Translation (2 mins)
      run: |
        echo "⏰ Data uploaded to Google. Sleeping for 120 seconds to allow formula & translation syncing..."
        sleep 120
        echo "✅ Buffer time ended. Resuming pipeline..."

    # 6. 【动作二】执行反向灌注：从 Google Sheets 将更新/调整完的数据，重新倒灌回飞书 sheet
    - name: Run Script 2 (Google Sheets back to Feishu)
      env:
        FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        python download_gs_to_feishu.py
